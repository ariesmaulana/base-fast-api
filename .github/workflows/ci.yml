name: Base Fast Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t base-fast-api .

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL services to be ready..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -d base_fast; do sleep 2; done'
          timeout 60 bash -c 'until docker compose exec -T postgres_test pg_isready -U postgres -d test_db_1; do sleep 2; done'

      - name: Run tests
        run: docker compose exec -T web uv run pytest -n auto

      - name: Stop services
        run: docker compose down
        if: always()