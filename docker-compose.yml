services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb123
      POSTGRES_DB: base_fast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base_fast"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb123
      POSTGRES_DB: test_db_1
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db_1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:localdb123@postgres:5432/base_fast
      TEST_DATABASE_URL: postgresql://postgres:localdb123@postgres_test:5432/test_db_1
      ENV: development
      SECRET_KEY: somthing-that-already-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 45
      REFRESH_TOKEN_EXPIRE_MINUTES: 700
      R2_ENDPOINT_URL: r2-url
      R2_ACCESS_KEY_ID: xxxxx
      R2_SECRET_ACCESS_KEY: xxxx
      R2_BUCKET_NAME: bucketname
      R2_PUBLIC_BASE_URL: base_url
      R2_REGION: auto
    depends_on:
      postgres:
        condition: service_healthy
      postgres_test:
        condition: service_healthy
    volumes:
      - .:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  postgres_test_data: